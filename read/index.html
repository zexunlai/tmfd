<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Read a TMFD issue online.">
    <title>Read online — TMFD</title>
    <link rel="stylesheet" href="../assets/site.css?v=20261012-3">
    <!-- Versioned URL prevents a cached reader script from mismatching a newly deployed page. -->
    <script defer src="../assets/reader.js?v=20261012-2"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to issue</a>
    <header class="site-header">
      <a class="wordmark" href="../" aria-label="TMFD home"><img src="../assets/tmfd-logo.png" alt="TMFD"></a>
      <nav aria-label="Primary navigation">
        <a href="../">Home</a>
        <a href="../archive/">Magazine</a>
        <a href="../about/">About</a>
      </nav>
    </header>

    <main id="main" class="reader-main">
      <div class="sr-only">
        <h1 id="issue-title">Loading issue…</h1>
        <p id="issue-date"></p>
      </div>
      <div class="reader-layout">
        <aside id="reader-navigation" class="reader-navigation" aria-label="Issue contents" hidden></aside>
        <div id="reader-content" aria-live="polite"></div>
      </div>
      <div id="reader-actions" class="issue-action-matrix" hidden>
        <a id="read-online-en" class="button button-primary" href="#" hidden>Read online</a>
        <a id="read-online-zh" class="button button-primary" href="#" hidden>Read online in Chinese</a>
        <a id="open-pdf-en" class="button button-secondary" href="#" hidden>Open PDF</a>
        <a id="open-pdf-zh" class="button button-secondary" href="#" hidden>Open PDF (Chinese)</a>
      </div>
    </main>

    <button id="back-to-top" class="back-to-top" type="button" hidden aria-label="Back to the top of this issue">
      <span aria-hidden="true">↑</span><span>Top</span>
    </button>

    <footer class="site-footer">
      <span class="footer-name">Task Force on Music-related Financial Disclosures</span>
      <a href="../legal/">© <span id="year"></span> TMFD — Copyright &amp; Cookie Notice</a>
    </footer>
  </body>
</html>
